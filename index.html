<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>菲菲的爸爸媽媽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
html{background:#f4ecdc}body{background-attachment:fixed}
/* Layout: a scrapbook spread. Left page: the parent's polaroid taped down, with a voice wave. Right page: the conversation as paper notes. Teacher controls sit on a strip of washi tape above. Single paper-world theme, matching the lesson slides. */
:root{
  --paper:#f4ecdc; --paper2:#ebdfc6; --card:#fffdf7; --ink:#3d2f25; --muted:#8a7764;
  --red:#c8442f; --teal:#5a9aa6; --mustard:#d9a441; --kid:#dfeef3; --line:#d8c8a8;
  --f-hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-hand);font-size:17px;
  background:
    radial-gradient(1200px 600px at 10% 0%,#fff8e8 0,transparent 60%),
    radial-gradient(900px 500px at 100% 100%,#e6d6b8 0,transparent 60%),
    var(--paper)}
.app{min-height:100%;box-sizing:border-box;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{margin:0;font-weight:700;font-size:clamp(1.7rem,3vw,2.4rem);color:var(--red);letter-spacing:.04em;text-wrap:balance}
h1 small{display:inline-block;margin-left:10px;font-size:.95rem;color:var(--ink);font-weight:400;padding:2px 12px;
  background:linear-gradient(90deg,#f6c9d0aa,#c9e6e4aa,#f3e2a8aa);transform:rotate(-1.5deg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 1px 0 #0001}
.seg button{border:0;background:transparent;font:700 1.05rem var(--f-hand);color:var(--ink);padding:6px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.btn,select{font:400 1rem var(--f-hand);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
:is(.btn,select,.seg button,textarea,.chip):focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

.spread{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--card);border-radius:10px;
  box-shadow:0 2px 0 var(--line),0 14px 30px #6b4f2a22;position:relative;min-height:0}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:45.4%;width:18px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#0000000d 45%,#00000014 50%,#0000000d 55%,transparent);pointer-events:none}
@media (max-width:820px){.spread{grid-template-columns:1fr}.spread::after{display:none}}
.left{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:34px 20px 24px;min-width:0;
  background:repeating-linear-gradient(transparent 0 33px,#e9dcc2 33px 34px)}
.flower{position:absolute;font-size:2rem;opacity:.75}
.polaroid{position:relative;width:min(72%,310px);max-width:100%;background:#fff;padding:14px 14px 0;box-shadow:0 6px 18px #4a33202e;
  transform:rotate(-2.5deg);transition:transform .4s}
.polaroid.baba{transform:rotate(2deg)}
.polaroid .tape{position:absolute;top:-14px;left:50%;width:120px;height:30px;transform:translateX(-50%) rotate(-4deg);opacity:.85;
  background:repeating-linear-gradient(45deg,#e98b9b 0 8px,#f3b7c1 8px 16px)}
.polaroid.baba .tape{background:radial-gradient(circle,#fffbe0 3px,transparent 3.5px) 0 0/14px 14px,#c9cf57}
.photo{aspect-ratio:14/15;max-width:100%;overflow:hidden;background:var(--paper2)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform-origin:50% 90%}
.caption{text-align:center;font-size:1.6rem;font-weight:700;padding:10px 0 12px}
.caption span{display:block;font-size:.95rem;font-weight:400;color:var(--muted)}
.talking .photo img{animation:nod .42s ease-in-out infinite alternate}
@keyframes nod{to{transform:translateY(-2.5%) scale(1.025)}}
.wave{display:flex;align-items:center;gap:5px;height:44px}
.wave i{display:block;width:7px;height:8px;border-radius:4px;background:var(--teal);transition:height .2s}
.talking .wave i{animation:bar .5s ease-in-out infinite alternate}
.talking .wave i:nth-child(odd){background:var(--red)}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.25s}.wave i:nth-child(4){animation-delay:.05s}
.wave i:nth-child(5){animation-delay:.3s}.wave i:nth-child(6){animation-delay:.15s}.wave i:nth-child(7){animation-delay:.2s}
@keyframes bar{from{height:8px}to{height:40px}}
.status{font-size:1rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.talking .photo img,.talking .wave i{animation:none}.talking .wave i{height:26px}}

.right{display:flex;flex-direction:column;min-width:0;min-height:420px}
.log{flex:1;overflow-y:auto;max-height:60vh;padding:26px 22px 14px;display:flex;flex-direction:column;gap:16px}
.msg{position:relative;max-width:88%;padding:12px 18px 14px;font-size:clamp(1.4rem,2.3vw,2.05rem);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 2px 6px #4a33201f}
.msg .who{display:block;font-size:.9rem;color:var(--muted);margin-bottom:2px}
.msg.parent{align-self:flex-start;background:#fff7e3;transform:rotate(-.6deg)}
.msg.parent::before{content:"";position:absolute;top:-9px;left:22px;width:62px;height:18px;background:#f0c96a99;transform:rotate(-5deg)}
.msg.kid{align-self:flex-end;background:var(--kid);transform:rotate(.6deg)}
.msg.kid::before{content:"";position:absolute;top:-9px;right:22px;width:62px;height:18px;background:#9fcfd699;transform:rotate(4deg)}
.compose{border-top:2px dashed var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 1.02rem var(--f-hand);color:var(--ink);background:#fff6d8;border:0;padding:6px 12px;cursor:pointer;box-shadow:0 1px 3px #4a332022}
.chip:nth-child(2n){background:#fde3e6}.chip:nth-child(3n){background:#e2f0e6}
.row{display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:none;font:1.35rem var(--f-hand);padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fffef9;color:var(--ink)}
.send{font-size:1.2rem;padding:0 24px}
.hint{margin:0;font-size:.92rem;color:var(--muted)}
.warn{margin:0;font-size:.95rem;color:var(--red)}
.scenes{display:flex;flex-wrap:wrap;gap:8px}
.scene-tab{display:flex;align-items:center;gap:8px;font:700 1.02rem var(--f-hand);color:var(--ink);background:var(--card);border:1.5px solid var(--line);
  border-radius:10px;padding:4px 12px 4px 4px;cursor:pointer}
.scene-tab img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.scene-tab[aria-pressed="true"]{border-color:var(--red);background:#fdeee9;box-shadow:0 0 0 2px var(--red) inset}
.scene-tab span{text-align:left}
.scene-tab small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.scene-card{align-self:stretch;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;background:#fffaf0;padding:16px;
  box-shadow:0 2px 8px #4a33201f;position:relative;transform:rotate(-.3deg)}
@media (max-width:600px){.scene-card{grid-template-columns:1fr}}
.scene-card::before{content:"";position:absolute;top:-10px;left:40%;width:90px;height:20px;background:#e98b9b88;transform:rotate(-3deg)}
.scene-card img{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;background:#fff;padding:6px 6px 18px;box-sizing:border-box;box-shadow:0 2px 6px #4a332022;transform:rotate(-3deg)}
.scene-card h2{margin:0 0 6px;font-size:1.5rem;color:var(--red)}
.scene-card p{margin:0 0 12px;font-size:1.12rem;line-height:1.7}
.scene-card .acts{display:flex;flex-wrap:wrap;gap:8px}
.vlab{display:inline-flex;align-items:center;gap:4px;font-size:.95rem;color:var(--muted)}
.vlab select{max-width:210px}
.mic{margin:0;font-size:.95rem;background:#e2f0e6;padding:6px 10px;border-radius:6px}
.settings{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px}
.settings summary{cursor:pointer;font-weight:700}
.set-body p{margin:8px 0;line-height:1.6}
.set-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.set-row label{min-width:120px}
.set-row select{font:1rem var(--f-hand)}
.set-row input:disabled{opacity:.5}
.set-row input{flex:1;min-width:0;font:1rem var(--f-hand);padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fffef9;color:var(--ink)}
.gmsg{color:var(--teal);font-weight:700}
.ask{align-self:center;font-size:1.25rem;color:var(--teal);font-weight:700;padding:4px 0}
</style>
</head><body>


<div class="app">
  <header>
    <h1>《媽媽回來了》<small>如果是你，你會對爸爸媽媽說甚麼？</small></h1>
    <div class="tools">
      <label class="vlab">媽媽聲音 <select id="voice-mama"></select></label>
      <label class="vlab">爸爸聲音 <select id="voice-baba"></select></label>
      <button class="btn" id="mute" aria-pressed="false">🔊 朗讀：開</button>
      <button class="btn primary" id="next">下一位同學</button>
      <button class="btn" id="full">全螢幕</button>
    </div>
  </header>
  <details class="settings" id="settings">
    <summary>⚙ 設定（而家：<span id="mode"></span>）</summary>
    <div class="set-body">
      <p>選擇「預設回應」毋須上網和金鑰：角色會按同學所說的內容，以預設的粵語句子回應。</p>
      <p>如想使用 AI 即時回應：選擇 Poe（香港可用，需要 Poe 訂閱），貼上 poe.com/api/keys 的 API 金鑰，再按「儲存」和「測試」。</p>
      <div class="set-row"><label for="gprov">回應方式</label><select id="gprov"><option value="preset">預設回應（毋須上網）</option><option value="poe">Poe AI</option><option value="gemini">Gemini API（香港未必支援）</option></select></div>
      <div class="set-row"><label for="gkey">API 金鑰</label><input id="gkey" type="password" autocomplete="off" placeholder="貼上金鑰"></div>
      <div class="set-row"><label for="gmodel">模型</label><input id="gmodel" type="text" autocomplete="off"></div>
      <div class="set-row"><button class="btn primary" id="gsave">儲存</button><button class="btn" id="gtest">測試</button><button class="btn" id="gclear">清除金鑰</button></div>
      <p id="gmsg" class="gmsg"></p>
    </div>
  </details>

  <nav class="scenes" id="scenes" aria-label="情景"></nav>

  <main class="spread">
    <section class="left" id="stage" aria-label="角色">
      <span class="flower" style="top:14px;left:16px">🌼</span>
      <span class="flower" style="bottom:18px;right:18px">🍃</span>
      <figure class="polaroid" id="polaroid" style="margin:0">
        <div class="tape"></div>
        <div class="photo"><img id="photo" alt=""></div>
        <figcaption class="caption" id="caption"></figcaption>
      </figure>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="status" id="status" role="status">準備好了</div>
      <div class="seg" role="group" aria-label="由誰回應">
        <button id="role-mama" aria-pressed="true">媽媽</button>
        <button id="role-baba" aria-pressed="false">爸爸</button>
      </div>
    </section>

    <section class="right">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="compose">
        <p class="warn" id="voicewarn" hidden></p>
        <div class="chips" id="chips"></div>
        <div class="row">
          <textarea id="input" rows="2" placeholder="同學說完後，老師在此輸入，按 Enter 送出"></textarea>
          <button class="btn primary send" id="send">送出</button>
        </div>
        <p class="mic">🎤 想讓同學直接用粵語說話？先按一下輸入框，再使用電腦或 iPad 的「語音輸入」（選擇粵語／中文（香港）），說完後會自動轉成文字，再按「送出」。</p>
        <p class="hint">老師操作：選擇情景 →「讀出情景」→「開始對話」。按「下一位同學」會在同一個情景重新開始。</p>
      </div>
    </section>
  </main>
</div>

1. 你要準備兩個版本：「粵語」版本會被讀出嚟，一定要用地道、流暢嘅香港粵語口語，用繁體中文字寫（例如「喇」「呀」「嘅」「咗」「唔」「佢」「畀」「掛住」「辛苦晒」），好似真正嘅香港爸爸媽媽同小朋友講嘢咁；「書面語」版本會顯示喺屏幕上，意思同粵語版本一樣，但要用規範、通順嘅繁體中文書面語（例如「了」「的」「沒有」「他」「給」「想念」）。兩個版本都唔好夾英文。
小朋友係用粵語講嘢（可能經語音輸入轉成文字，會有口語或者錯字），請理解佢嘅意思。
2. 用字淺白，七歲小朋友聽得明。
3. 每次只講2至3句，每句唔好超過15個字。
4. 語氣溫柔、親切、真心，符合呢個情景（例如生病時關心佢身體、放學時見到佢好開心、放工時雖然攰但見到佢就唔攰）。可以叫對方「寶貝」或者「乖乖」，唔好估對方係仔定係女。
5. 先具體回應小朋友啱啱講嘅說話，等佢真實感受到「愛嘅回應」；佢講到關心或者行動，就具體讚佢、話佢知你有幾感動。
6. 如果小朋友講得好少或者唔知講咩，就溫柔噉引導，例如「你想同${p}講啲咩呀？」。
7. 適當時候自然噉帶出：爸爸媽媽辛苦，係因為愛你、愛呢個家。
8. 唔好說教，唔好長篇大論，唔好用表情符號。

安全守則：
1. 唔好問小朋友嘅名、住址、學校或者屋企人資料。
2. 如果小朋友講到傷心嘅事（例如爸爸媽媽唔喺身邊、屋企人嗌交），要溫柔噉安慰佢，鼓勵佢同老師或者信任嘅大人講，唔好追問。
3. 唔好承諾現實嘅事，唔好扮係小朋友真正嘅爸爸媽媽，你只係情景入面嘅${p}。
4. 如果小朋友講咗無關或者唔恰當嘅說話，溫和噉帶返去情景同「關心屋企人」。

一定要用以下格式輸出三行，唔好加任何其他文字、引號或者解釋：
學生：（將小朋友啱啱講嘅說話改寫成通順嘅書面語，保持原意）
書面語：（${p}回應嘅書面語版本）
粵語：（同一個回應嘅粵語口語版本）`;
}

/* ---------- 粵語朗讀 ---------- */
const isCanto = v => /zh[-_]HK|yue/i.test(v.lang) || /cantonese|粵|粤|廣東|hong ?kong/i.test(v.name);
const MALE=/WanLung|Danny|Aasing|\bmale\b|男/i, FEMALE=/HiuGaai|HiuMaan|Tracy|Sinji|female|女/i;
const isNatural=v=>/natural|online|neural|premium|enhanced/i.test(v.name);
const shortName=v=>v.name.replace(/^Microsoft\s+/i,"").replace(/\s*-\s*Chinese.*$/i,"").replace(/\s*\(Natural\)/i,"（自然）").replace(/\s*Online/i,"");
function warn(msg){ $("voicewarn").textContent=msg||""; $("voicewarn").hidden=!msg; }
function loadVoices(){
  const sels={mama:$("voice-mama"),baba:$("voice-baba")};
  if(!("speechSynthesis" in window)){ Object.values(sels).forEach(s=>s.innerHTML='<option>不支援朗讀</option>'); warn("這個瀏覽器不支援朗讀，請改用 Microsoft Edge 開啟。"); return; }
  const raw=speechSynthesis.getVoices(); if(!raw.length) return;
  const all=raw.filter(v=>/^(zh|yue|cmn)/i.test(v.lang));
  const canto=all.filter(isCanto).sort((a,b)=>isNatural(b)-isNatural(a));
  voices=[...canto, ...all.filter(v=>!isCanto(v))];
  for(const r of ["mama","baba"]){
    const sel=sels[r]; sel.innerHTML="";
    if(!voices.length){ sel.innerHTML='<option value="">找不到中文語音</option>'; continue; }
    voices.forEach((v,i)=>{const o=document.createElement("option");o.value=i;
      const g=MALE.test(v.name)?"男":FEMALE.test(v.name)?"女":"";
      o.textContent=(isCanto(v)?"粵語":"其他中文")+(g?"・"+g:"")+"・"+shortName(v);sel.append(o)});
    let saved=null; try{saved=localStorage.getItem("voice-"+r)}catch(e){}
    let idx=voices.findIndex(v=>v.name===saved);
    if(idx<0) idx=voices.findIndex(v=>isCanto(v)&&(r==="baba"?MALE.test(v.name):FEMALE.test(v.name)&&!MALE.test(v.name)));
    if(idx<0) idx=0;
    sel.value=idx;
    sel.onchange=()=>{ try{localStorage.setItem("voice-"+r,voices[sel.value]?.name||"")}catch(e){} };
  }
  if(!canto.length) warn("這部電腦沒有粵語語音。建議使用 Microsoft Edge 開啟本頁，便有自然的粵語男聲和女聲。");
  else if(!canto.some(v=>MALE.test(v.name))) warn("這部電腦沒有粵語男聲。使用 Microsoft Edge 開啟本頁，可選擇 WanLung（男聲）及 HiuGaai／HiuMaan（女聲）。");
  else warn("");
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; } else loadVoices();

const talk=on=>stage.classList.toggle("talking",on);
function speak(text,narrate){
  return new Promise(res=>{
    const anim=!narrate;
    const fake=()=>{ if(anim) talk(true); setTimeout(()=>{talk(false);res()}, narrate?0:Math.min(9000,240*text.length)); };
    if(muted || !("speechSynthesis" in window) || !voices.length){ fake(); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=voices[$("voice-"+(narrate?"mama":role)).value]; if(v){u.voice=v;u.lang=v.lang}else u.lang="zh-HK";
    u.pitch=narrate?1:PARENT[role].pitch; u.rate=narrate?.85:PARENT[role].rate;
    u.onstart=()=>{ if(anim) talk(true); };
    u.onend=u.onerror=()=>{talk(false);res()};
    speechSynthesis.speak(u);
  });
}

async function withTimeout(fn){
  ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),20000);
  try{ return await fn(ctrl.signal); }
  catch(e){ if(e.name==="AbortError") throw new Error("等候太久，沒有回應"); if(e instanceof TypeError) throw new Error("未能連接伺服器（可能是網絡封鎖或瀏覽器限制）"); throw e; }
  finally{ clearTimeout(timer); }
}
/* messages: [{role:"user"|"assistant",content}] */
async function askAI(system, messages){
  const p=provEl.value, key=keyEl.value.trim(), model=modelEl.value.trim()||DEFAULT_MODEL[p];
  if(p==="poe"){
    return withTimeout(async signal=>{
      const r=await fetch("https://api.poe.com/v1/chat/completions",{method:"POST",signal,
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
        body:JSON.stringify({model,messages:[{role:"system",content:system},...messages],max_tokens:300,stream:false})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d?.error?.message||("HTTP "+r.status));
      const t=(d.choices?.[0]?.message?.content||"").trim(); if(!t) throw new Error("AI 沒有回應"); return t;
    });
  }
  const body={system_instruction:{parts:[{text:system}]},
    contents:messages.map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.content}]})),
    generationConfig:{temperature:.8,maxOutputTokens:300}};
  if(/2\.5-flash/.test(model)) body.generationConfig.thinkingConfig={thinkingBudget:0};
  return withTimeout(async signal=>{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
      {method:"POST",signal,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d?.error?.message||("HTTP "+r.status));
    const t=(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("").trim(); if(!t) throw new Error("AI 沒有回應"); return t;
  });
}

const lastPick={};
function presetReply(text){
  const it=(INTENTS.find(i=>i.re.test(text))||{k:"none"}).k;
  const pool=BANK[role][it]; let i;
  do{ i=Math.floor(Math.random()*pool.length); }while(pool.length>1 && lastPick[role+it]===i);
  lastPick[role+it]=i; return {show:pool[i][0], say:pool[i][1]};
}

function parseAI(raw){
  const pick=k=>{ const m=raw.match(new RegExp("^\\s*"+k+"\\s*[：:]\\s*(.+)$","m")); return m?m[1].trim():""; };
  const show=pick("書面語"), say=pick("粵語"), student=pick("學生");
  if(!show && !say) return {show:raw.trim(), say:raw.trim(), raw};
  return {show:show||say, say:say||show, student, raw};
}
function greeting(){ return scene.greet[role]; } /* {show,say} */
function startTalk(){
  if(started) return; started=true;
  const g=greeting(); addMsg("parent",g.show); status("正在說話……");
  speak(g.say).then(()=>status("準備好了")); input.focus();
}
async function reply(text){
  if(busy) return;
  if(!started){ started=true; addMsg("parent",greeting().show); }
  busy=true; $("send").disabled=true;
  const kidEl=addMsg("kid",text); history.push({role:"user",content:text});
  const out=addMsg("parent","……"); status(PARENT[role].name+"正在思考……");
  let answer=null, usedAI=false;
  if(useAI()){
    try{
      const g=greeting();
      const msgs=[{role:"user",content:"（情景開始）"},{role:"assistant",content:"學生：（情景開始）\n書面語："+g.show+"\n粵語："+g.say},...history];
      const raw=await askAI(instructions(scene,role), msgs);
      answer=parseAI(raw); usedAI=true;
      if(answer.student) kidEl.textContent=answer.student;
    }catch(e){ answer=null; }
  }
  if(!answer) answer=presetReply(text);
  out.textContent=answer.show;
  history.push({role:"assistant",content:(answer.raw||("學生："+text+"\n書面語："+answer.show+"\n粵語："+answer.say))});
  status(usedAI||!useAI() ? "正在說話……" : "AI 未能連線，已改用預設回應");
  await speak(answer.say);
  status("準備好了"); busy=false; $("send").disabled=false; input.focus();
}
function reset(showCard){
  if(ctrl) ctrl.abort(); if("speechSynthesis" in window) speechSynthesis.cancel();
  talk(false); busy=false; $("send").disabled=false; history=[]; started=false; log.innerHTML="";
  if(showCard) sceneCard();
  status("準備好了");
}
function chooseScene(s){
  scene=s;
  SCENES.forEach(x=>$("tab-"+x.id).setAttribute("aria-pressed", x===s));
  setRole(s.role); renderChips(); reset(true);
}

$("send").onclick=()=>{const t=input.value.trim(); if(t){input.value=""; reply(t);}};
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("send").click();} });
$("role-mama").onclick=()=>{ if(role!=="mama"){ setRole("mama"); reset(true); } };
$("role-baba").onclick=()=>{ if(role!=="baba"){ setRole("baba"); reset(true); } };
$("next").onclick=()=>{ reset(false); log.append(Object.assign(document.createElement("div"),{className:"ask",textContent:`${scene.tab}：${scene.title}`})); startTalk(); };
$("mute").onclick=()=>{ muted=!muted; $("mute").textContent=muted?"🔇 朗讀：關":"🔊 朗讀：開"; $("mute").setAttribute("aria-pressed",muted); if(muted&&"speechSynthesis" in window) speechSynthesis.cancel(); };
$("full").onclick=()=>{ try{ const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); p?.catch?.(()=>{}); }catch(e){} };

chooseScene(SCENES[0]);
</script>
